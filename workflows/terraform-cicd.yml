name: Terraform CI/CD

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'environments/**'
      - 'modules/**'
      - '.github/workflows/terraform-cicd.yml'
  push:
    branches: [ main ]
    paths:
      - 'environments/**'
      - 'modules/**'
      - '.github/workflows/terraform-cicd.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment to deploy'
        required: true
        default: 'prod'
        type: choice
        options:
          - preprod
          - prod
      apply:
        description: 'Apply Terraform changes to the selected environment'
        required: false
        default: false
        type: boolean

jobs:
  terraform:
    name: Terraform - ${{ matrix.environment }}
    runs-on: [self-hosted, terraform]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        environment: [preprod, prod]

    if: github.event_name != 'workflow_dispatch' || inputs.environment == matrix.environment

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_VAR_environment: ${{ matrix.environment }}

    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}/environments/${{ matrix.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform format check
        run: terraform fmt -check -diff -recursive ../..

      - name: Terraform init
        run: terraform init -input=false -upgrade

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event_name != 'workflow_dispatch' || !inputs.apply
        run: terraform plan -input=false -no-color -lock=false -var-file=terraform.tfvars

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply
        run: terraform apply -input=false -auto-approve -lock=false -var-file=terraform.tfvars
